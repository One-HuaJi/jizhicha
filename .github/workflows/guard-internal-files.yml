name: guard-internal-files

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # 1) Path guard: keep internal documents and binary release artifacts out of Git.
  guard-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for internal/local/build artifacts
        run: |
          set -o pipefail
          forbidden='^(release/|.*/HANDOFF\.md$|.*/PROGRESS\.md$|.*/docs/internal/|.*\.(apk|aab|zip|sha1|sha256|log|exe|msi|dll|so|pdb|docx|xlsx)$|.*/key\.properties$|.*\.(keystore|jks|key|pem)$)'
          # 必须入库的构建资产，显式放行（不要放宽上面的规则本身）：
          #   - 综测导出模板：官方 .docx 骨架，元数据由下面的 DOCX 检查单独把关
          #   - Wintun：Windows 端 VPN 的必需运行库，属于随包分发而非构建残留
          allowed='^(jizhicha/assets/templates/[^/]+\.docx|jizhicha/windows/wintun/wintun\.dll)$'
          hits="$(git ls-files | grep -E "$forbidden" | grep -vE "$allowed" || true)"
          if [ -n "$hits" ]; then
            echo "::error::The following files must not be committed to the public repo:"
            echo "$hits"
            echo ""
            echo "Remove them from the commit (do not use 'git add -f')."
            exit 1
          fi
          echo "OK: no internal/local/build artifacts found."

  # 2) Privacy guard: personal identifiers must not appear in tracked text,
  #    commit messages, or DOCX author metadata.
  #
  #    日志纪律：本 job 的日志是**公开可读**的，所以任何一步都**不得**把命中的
  #    原文打印出来 —— 只允许打印「规则名 + 违规文件路径 / 提交 SHA」。
  #    否则守卫一旦报错，就等于把它本该拦下的内容又公开了一遍。
  guard-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked text for personal identifiers
        env:
          KNOWN_REAL_IDENTIFIERS: ${{ secrets.KNOWN_REAL_IDENTIFIERS }}
        run: |
          set -o pipefail
          fail=0

          # 1) 已知标识清单 —— 一旦出现必定需要拦截。
          #    清单取值不写在本文件里：本工作流公开可见，只能从仓库 Secret
          #    `KNOWN_REAL_IDENTIFIERS`（`|` 分隔的正则片段）读取。
          #    未配置该 Secret 时跳过这一条，只靠下面 2)3) 的形态扫描。
          if [ -n "${KNOWN_REAL_IDENTIFIERS:-}" ]; then
            hits="$(git grep -nIE "$KNOWN_REAL_IDENTIFIERS" -- . ':(exclude).github/workflows/*' || true)"
            if [ -n "$hits" ]; then
              echo "::error::Known identifiers matched in the following files:"
              # 只回显文件路径，绝不回显命中的内容。
              echo "$hits" | cut -d: -f1 | sort -u
              fail=1
            fi
          else
            echo "::notice::KNOWN_REAL_IDENTIFIERS 未配置，跳过「已知标识硬拦」（形态扫描仍然生效）。"
          fi

          # 2)+3) 形态扫描（学号 / 班级 / 会话 IP / 本机路径 / 房号 / 教师名）统一交给
          #    jizhicha/tool/check_pii.ps1 —— 与本地 `pwsh -File tool/check_pii.ps1` 同一份规则。
          #    以前这里内联了两条 grep，排除号段写的是 2024000000xx，而脚本的允许号段是
          #    2024000xxxxx；测试夹具 2024000001xx 落在两者之间，于是本地门禁通过、CI 长期红
          #    （2026-11-13 定位并修）。规则只留一份，避免再次漂移。
          #    -NoValueInOutput：日志里只出现「路径:行号 [规则名]」，不出现命中原文。
          if ! pwsh -NoProfile -File jizhicha/tool/check_pii.ps1 -NoValueInOutput; then
            echo "::error::Personal-identifier-shaped values found in tracked text (paths listed above)."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: no personal identifiers in tracked text."
      - name: Scan commit messages for personal identifiers
        env:
          KNOWN_REAL_IDENTIFIERS: ${{ secrets.KNOWN_REAL_IDENTIFIERS }}
        run: |
          set -o pipefail
          # 提交信息只查已知标识清单：合法占位数据（2024000000xx）不应导致失败。
          # 清单同样只来自 Secret。未配置时跳过。
          if [ -z "${KNOWN_REAL_IDENTIFIERS:-}" ]; then
            echo "::notice::KNOWN_REAL_IDENTIFIERS 未配置，跳过提交信息硬拦。"
            exit 0
          fi
          # git log --grep 覆盖 **subject 与 body**；命中时只打印 SHA，
          # 不打印提交信息原文（日志是公开的）。
          offenders="$(git log --format='%H' --extended-regexp --grep="$KNOWN_REAL_IDENTIFIERS" || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Known identifiers matched in the message of these commits:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no known identifiers in commit messages."
      - name: Scan DOCX assets for author metadata
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r docx; do
            [ -z "$docx" ] && continue
            if ! unzip -p "$docx" docProps/core.xml > /tmp/core.xml 2>/dev/null; then
              continue
            fi
            creator="$(grep -oE '<dc:creator>[^<]*' /tmp/core.xml | sed 's/<dc:creator>//' || true)"
            modified="$(grep -oE '<cp:lastModifiedBy>[^<]*' /tmp/core.xml | sed 's/<cp:lastModifiedBy>//' || true)"
            if [ "$creator" != "稽之查" ] || [ "$modified" != "稽之查" ]; then
              # 只报文件与字段名，不报字段值（值本身就是身份信息）。
              echo "::error::$docx embeds non-neutral author metadata (dc:creator / cp:lastModifiedBy)"
              fail=1
            fi
          done < <(git ls-files '*.docx')
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: tracked DOCX assets have neutral author metadata."

  # 3) Dependency guard: manifests must stay consistent with their lockfiles.
  guard-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 必须固定到与本仓库 pubspec.lock 相同的 Flutter 版本。
      # intl / matcher / meta / test_api / vector_math 这几个是被 Flutter SDK
      # 自身锁定的包，跟着 `channel: stable` 走会在 SDK 一升级时就让
      # `--enforce-lockfile` 失败 —— 那是 SDK 版本差异，不是依赖漂移。
      # 版本与 jizhicha/.metadata 记录的 revision 对应（058e0af2c2 / 3.44.8）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Flutter lockfile is respected
        working-directory: jizhicha
        run: flutter pub get --enforce-lockfile
      # 与 jizhicha/huse-vpn-next/rust-toolchain.toml 保持一致，
      # 避免 CI 用另一版 Rust 校验出与发布工具链无关的差异。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Cargo workspace metadata is locked
        working-directory: jizhicha/huse-vpn-next
        run: cargo metadata --locked --format-version 1 > /dev/null

  # 4) Rust guard: rustfmt + clippy + 测试。clippy 以 `-D warnings` 运行，
  #    因此任何新告警都会直接让 CI 失败（零告警门禁）。
  #
  # 为什么必须用 windows-latest 而不是 ubuntu-latest：
  # `ffi` crate 通过 `#[path]` 引入了 `desktop/src-tauri/src/commands.rs`，
  # 而该文件 `use huse_vpn_core::tunnel::...`；core 里的 `tunnel` 模块本身是
  # `#[cfg(windows)]` 的。于是在 Linux 目标下 `ffi` 根本编译不出来 ——
  # 这是**既有**问题，不是本 job 引入的。Windows 才是这套桌面 FFI 的真实
  # 目标平台，所以 Rust 门禁跟着目标平台走。
  #
  # toolchain 与 jizhicha/huse-vpn-next/rust-toolchain.toml 固定的 1.98.1
  # 保持一致，避免 CI 用另一版 Rust 校验出与发布工具链无关的差异。
  guard-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: jizhicha/huse-vpn-next
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: jizhicha/huse-vpn-next
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        working-directory: jizhicha/huse-vpn-next
        run: cargo test --workspace

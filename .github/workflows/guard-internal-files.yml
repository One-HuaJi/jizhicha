name: guard-internal-files

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # 1) Path guard: keep internal documents and binary release artifacts out of Git.
  guard-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for internal/local/build artifacts
        run: |
          set -o pipefail
          forbidden='^(release/|.*/HANDOFF\.md$|.*/PROGRESS\.md$|.*/docs/internal/|.*\.(apk|aab|zip|sha1|sha256|log|exe|msi|dll|so|pdb|docx|xlsx)$|.*/key\.properties$|.*\.(keystore|jks|key|pem)$)'
          # 必须入库的构建资产，显式放行（不要放宽上面的规则本身）：
          #   - 综测导出模板：官方 .docx 骨架，元数据由下面的 DOCX 检查单独把关
          #   - Wintun：Windows 端 VPN 的必需运行库，属于随包分发而非构建残留
          allowed='^(jizhicha/assets/templates/[^/]+\.docx|jizhicha/windows/wintun/wintun\.dll)$'
          hits="$(git ls-files | grep -E "$forbidden" | grep -vE "$allowed" || true)"
          if [ -n "$hits" ]; then
            echo "::error::The following files must not be committed to the public repo:"
            echo "$hits"
            echo ""
            echo "Remove them from the commit (do not use 'git add -f')."
            exit 1
          fi
          echo "OK: no internal/local/build artifacts found."

  # 2) Privacy guard: personal identifiers must not appear in tracked text,
  #    commit messages, or DOCX author metadata. A real author name previously
  #    reached a public release because only file paths were checked.
  guard-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked text for personal identifiers
        run: |
          set -o pipefail
          fail=0

          # 1) 已知的真实标识 —— 一旦出现必定是泄漏。
          known='(***REMOVED-STUDENT-ID***|***REMOVED-STUDENT-ID***|***REMOVED-CLASS***|***REMOVED-NAME***|***REMOVED-NAME***)'
          hits="$(git grep -nIE "$known" -- . ':(exclude).github/workflows/*' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Known real personal identifiers found:"
            echo "$hits"
            fail=1
          fi

          # 2) 形如真实学号的 12 位数字，但排除已文档化的合成占位号段
          #    2024000000xx（测试 fixture 使用）。这样以后即使有人粘进新的
          #    真实学号也仍会被拦下，而不会误报合法占位数据。
          ids="$(git grep -nIE '2024[0-9]{8}' -- . ':(exclude).github/workflows/*' \
                 | grep -vE '2024000000[0-9]{2}' || true)"
          if [ -n "$ids" ]; then
            echo "::error::Student-ID-shaped values outside the 2024000000xx placeholder block:"
            echo "$ids"
            fail=1
          fi

          # 3) 真实班级名形态，排除已文档化的示例班（生教2401班）。
          cls="$(git grep -nIE '生教[0-9]{4}班' -- . ':(exclude).github/workflows/*' \
                 | grep -vE '生教2401班' || true)"
          if [ -n "$cls" ]; then
            echo "::error::Class-name-shaped values outside the documented example:"
            echo "$cls"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: no personal identifiers in tracked text."
      - name: Scan commit messages for personal identifiers
        run: |
          set -o pipefail
          # 提交信息只查已知真实标识：合法占位数据（2024000000xx）不应导致失败。
          known='(***REMOVED-STUDENT-ID***|***REMOVED-STUDENT-ID***|***REMOVED-CLASS***)'
          hits="$(git log --format='%h %s' | grep -E "$known" || true)"
          if [ -n "$hits" ]; then
            echo "::error::Known real personal identifiers found in commit messages:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no known personal identifiers in commit messages."
      - name: Scan DOCX assets for author metadata
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r docx; do
            [ -z "$docx" ] && continue
            if ! unzip -p "$docx" docProps/core.xml > /tmp/core.xml 2>/dev/null; then
              continue
            fi
            creator="$(grep -oE '<dc:creator>[^<]*' /tmp/core.xml | sed 's/<dc:creator>//' || true)"
            modified="$(grep -oE '<cp:lastModifiedBy>[^<]*' /tmp/core.xml | sed 's/<cp:lastModifiedBy>//' || true)"
            if [ "$creator" != "稽之查" ] || [ "$modified" != "稽之查" ]; then
              echo "::error::$docx embeds non-neutral author metadata (creator='$creator', lastModifiedBy='$modified')"
              fail=1
            fi
          done < <(git ls-files '*.docx')
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: tracked DOCX assets have neutral author metadata."

  # 3) Dependency guard: manifests must stay consistent with their lockfiles.
  guard-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 必须固定到与本仓库 pubspec.lock 相同的 Flutter 版本。
      # intl / matcher / meta / test_api / vector_math 这几个是被 Flutter SDK
      # 自身锁定的包，跟着 `channel: stable` 走会在 SDK 一升级时就让
      # `--enforce-lockfile` 失败 —— 那是 SDK 版本差异，不是依赖漂移。
      # 版本与 jizhicha/.metadata 记录的 revision 对应（058e0af2c2 / 3.44.8）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Flutter lockfile is respected
        working-directory: jizhicha
        run: flutter pub get --enforce-lockfile
      # 与 jizhicha/huse-vpn-next/rust-toolchain.toml 保持一致，
      # 避免 CI 用另一版 Rust 校验出与发布工具链无关的差异。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Cargo workspace metadata is locked
        working-directory: jizhicha/huse-vpn-next
        run: cargo metadata --locked --format-version 1 > /dev/null

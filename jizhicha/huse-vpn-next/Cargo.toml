[workspace]
resolver = "2"
# The standalone Tauri shell is retained only as source history. The product
# now embeds the VPN through Flutter FFI, so workspace builds must not compile
# or package the obsolete second desktop application.
members = ["core", "ffi", "mobile-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libc = "0.2"
jni = "0.21"
num-bigint = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "cookies"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun2 = { version = "2", features = ["async"] }
x509-cert = "0.3"
zeroize = "1"

[patch.crates-io]
# tun2 uses wintun-bindings for adapter address/MTU setup. Keep that helper
# inside this workspace so its netsh calls inherit the same no-console policy
# as the rest of the VPN implementation.
wintun-bindings = { path = "vendor/wintun-bindings-0.6.4" }
